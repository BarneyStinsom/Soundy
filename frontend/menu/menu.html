<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soundy</title>
    <link rel="icon" type="image/png" href="../imagens/Logo.png">
</head>

<body>

    <h1>Soundy</h1>

    <nav>

        <button id="playlistsBtn" type="button">Playlists</button>
        <button id="adminBtn" type="button" hidden>Painel Admin</button>

    <!-- busca -->

    <h2>Artistas</h2>

    <script src="../js/menu.js"></script>

</html>
